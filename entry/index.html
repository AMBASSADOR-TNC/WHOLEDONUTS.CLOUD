<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whole Donuts – Unified Identity Engine</title>

    <!-- CORE IDENTITY ENGINE -->
    <link rel="stylesheet" href="../identity.css">
    <script src="../identity-engine.js" defer></script>

    <!-- PROTOCOL ENGINE -->
    <script src="../protocol-engine.js" defer></script>

    <!-- MOVEMENT ENGINE -->
    <script src="../movement-engine.js" defer></script>

    <!-- ROUTER -->
    <script src="../router.js" defer></script>

    <!-- MINIMALIST BLACK & WHITE STYLE -->
    <style>
        body {
            background:#fff;
            color:#000;
            font-family:Arial, Helvetica, sans-serif;
            margin:0;
            padding:0;
        }
        #identity-container {
            width:100%;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
        }
        .symbol {
            font-size:6rem;
            font-weight:bold;
            letter-spacing:-4px;
            cursor:pointer;
            transition:0.2s ease;
        }
        .symbol:hover {
            transform:scale(1.08);
        }
        .subtext {
            margin-top:20px;
            font-size:1.2rem;
            opacity:0.7;
        }
    </style>
</head>

<body>

<div id="identity-container">
    <div class="symbol">+U</div>
    <div class="subtext">Unified Identity Engine</div>
</div>

</body>
</html>
