<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE COUNTER — ADULT IDENTITY HUB</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #000;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        p {
            font-size: 16px;
            color: #000;
            max-width: 420px;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .box {
            width: 240px;
            height: 240px;
            border: 4px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .box:hover {
            background: #000;
            color: #fff;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .back {
            margin-top: 40px;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            border: 2px solid #000;
            padding: 10px 20px;
            transition: 0.2s;
        }

        .back:hover {
            background: #000;
            color: #fff;
        }
    </style>
</head>

<body>

    <h1>THE COUNTER</h1>

    <p>
        Welcome to the Adult Identity Hub.  
        This is where your permanent seat number is assigned  
        and your adult identity path begins.
    </p>

    <a href="../"><div class="box">ENTER</div></a>

    <a href="../"><div class="back">BACK TO ADULT</div></a>

</body>
</html>
