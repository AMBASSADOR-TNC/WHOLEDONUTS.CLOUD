<div class="wd-identity-animation">
  <svg id="wdIdentitySVG" width="240" height="240" viewBox="0 0 240 240">

    <!-- Stick Figure Body -->
    <circle cx="120" cy="70" r="22" stroke="#000" stroke-width="4" fill="none" />
    <line x1="120" y1="92" x2="120" y2="160" stroke="#000" stroke-width="4" />
    <line x1="120" y1="120" x2="90" y2="150" stroke="#000" stroke-width="4" />
    <line x1="120" y1="120" x2="150" y2="150" stroke="#000" stroke-width="4" />
    <line x1="120" y1="160" x2="95" y2="200" stroke="#000" stroke-width="4" />
    <line x1="120" y1="160" x2="145" y2="200" stroke="#000" stroke-width="4" />

    <!-- Cauldron -->
    <ellipse cx="120" cy="150" rx="40" ry="18" stroke="#000" stroke-width="4" fill="none" />

    <!-- Glowing + -->
    <text id="wdGlowPlus" x="120" y="145" text-anchor="middle" font-size="28" font-weight="900" fill="#000">+</text>

    <!-- Ghosted Overflow Hands -->
    <line x1="120" y1="120" x2="70" y2="140" stroke="#000" stroke-width="3" opacity="0.15" />
    <line x1="120" y1="120" x2="170" y2="140" stroke="#000" stroke-width="3" opacity="0.15" />

  </svg>

  <div class="wd-identity-labels">
    <div class="wd-label youth">WHOLE DONUTS</div>
    <div class="wd-label chef">NURTURED CHEF</div>
    <div class="wd-label movement">MOVEMENT</div>
    <div class="wd-label humanity">HUMANITY</div>
  </div>
</div>

<style>
  .wd-identity-animation {
    text-align: center;
    margin: 2rem auto;
  }

  #wdGlowPlus {
    animation: wdGlowPulse 2.2s infinite ease-in-out;
  }

  @keyframes wdGlowPulse {
    0% { opacity: 0.3; }
    50% { opacity: 1; }
    100% { opacity: 0.3; }
  }

  .wd-label {
    font-size: 1rem;
    font-weight: 700;
    margin-top: 0.4rem;
    opacity: 0;
    animation: wdLabelFade 1.2s forwards;
  }

  .wd-label.youth { animation-delay: 0.4s; }
  .wd-label.chef { animation-delay: 0.8s; }
  .wd-label.movement { animation-delay: 1.2s; }
  .wd-label.humanity { animation-delay: 1.6s; }

  @keyframes wdLabelFade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
