<!-- ========================================================= -->
<!--  TABLE928 — EMOTIONAL TILE CREATOR (PROTO T LABEL CODE)   -->
<!-- ========================================================= -->

<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ===== META ===== -->
  <meta charset="UTF-8" />

  <!-- ===== PAGE TITLE ===== -->
  <title>EMOTIONAL TILE CREATOR • THE EMOTIONAL TABLE OF HEALING</title>

  <!-- ===== IDENTITY ENGINE ===== -->
  <link rel="stylesheet" href="../assets/css/identity.css" />
  <script src="../assets/js/identity-engine.js" defer></script>

  <!-- ===== CREATOR STYLES ===== -->
  <style>
    /* --- LAYOUT --- */
    .creator-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
    }

    /* --- FORM --- */
    .creator-form {
      border-right: 1px solid #ccc;
      padding-right: 1rem;
    }

    .creator-field { margin-bottom: 0.75rem; }
    .creator-label { font-weight: 600; margin-bottom: 0.25rem; }
    .creator-input, .creator-select, .creator-textarea {
      width: 100%; padding: 0.35rem; border-radius: 4px; border: 1px solid #999;
    }
    .creator-textarea { min-height: 80px; resize: vertical; }

    /* --- BUTTONS --- */
    .creator-actions { margin-top: 0.75rem; display: flex; gap: 0.5rem; }
    .creator-button {
      border: 1px solid #000; padding: 0.35rem 0.75rem;
      border-radius: 4px; background: #fff; cursor: pointer;
    }

    /* --- PREVIEW --- */
    .tile-preview-wrapper { display: flex; flex-direction: column; gap: 0.75rem; }
    .tile-preview {
      border-radius: 8px; padding: 0.75rem; min-height: 120px;
      display: flex; flex-direction: column; justify-content: center;
      align-items: center; text-align: center;
    }
    .tile-preview-name { font-weight: 600; margin-bottom: 0.25rem; }
    .tile-preview-group { font-size: 0.75rem; opacity: 0.8; margin-bottom: 0.25rem; }
    .tile-preview-desc { font-size: 0.8rem; line-height: 1.3rem; }
  </style>
</head>

<body>
  <div class="page">

    <!-- ========================================================= -->
    <!--  HEADER                                                   -->
    <!-- ========================================================= -->
    <header class="identity-header">
      <div class="identity-inner">
        <div class="title-crayon">TABLE928</div>
        <div class="title-bold">EMOTIONAL TILE CREATOR</div>
      </div>
    </header>

    <!-- ========================================================= -->
    <!--  MAIN CONTENT                                             -->
    <!-- ========================================================= -->
    <main class="content">
      <div class="content-inner">

        <!-- ===== INTRO ===== -->
        <div class="section-title">Create your tile for THE EMOTIONAL TABLE OF HEALING</div>
        <div class="section-body">
          Design an emotional “element” for THE EMOTIONAL TABLE OF HEALING.
          No names, no faces — just your emotion, your meaning, your art.
        </div>

        <!-- ========================================================= -->
        <!--  CREATOR LAYOUT                                           -->
        <!-- ========================================================= -->
        <div class="creator-layout">

          <!-- ========================================================= -->
          <!--  LEFT: FORM                                              -->
          <!-- ========================================================= -->
          <section class="creator-form">

            <!-- ===== EMOTION NAME ===== -->
            <div class="creator-field">
              <label class="creator-label">Emotion Name</label>
              <input id="tileName" class="creator-input" type="text"
                     placeholder="e.g., Quiet Brave, Storm Calm" />
            </div>

            <!-- ===== GROUP ===== -->
            <div class="creator-field">
              <label class="creator-label">Group</label>
              <select id="tileGroup" class="creator-select">
                <option value="core">Core</option>
                <option value="intense">Intense</option>
                <option value="protective">Protective</option>
                <option value="growth">Growth</option>
              </select>
            </div>

            <!-- ===== COLOR ===== -->
            <div class="creator-field">
              <label class="creator-label">Tile Color</label>
              <input id="tileColor" class="creator-input" type="color" value="#ffe9b3" />
            </div>

            <!-- ===== DESCRIPTION ===== -->
            <div class="creator-field">
              <label class="creator-label">Emotion Meaning</label>
              <textarea id="tileDesc" class="creator-textarea"
                        placeholder="Describe what this emotion feels like and when it shows up."></textarea>
            </div>

            <!-- ===== ACTIONS ===== -->
            <div class="creator-actions">
              <button id="previewButton" class="creator-button">PREVIEW TILE</button>
              <button id="saveButton" class="creator-button">SAVE TILE</button>
            </div>

          </section>

          <!-- ========================================================= -->
          <!--  RIGHT: PREVIEW                                          -->
          <!-- ========================================================= -->
          <section class="tile-preview-wrapper">
            <div id="tilePreview" class="tile-preview">
              <div id="previewName" class="tile-preview-name">Your tile will appear here.</div>
              <div id="previewGroup" class="tile-preview-group">Choose group + color.</div>
              <div id="previewDesc" class="tile-preview-desc"></div>
            </div>
          </section>

        </div>

      </div>
    </main>

  </div>

  <!-- ========================================================= -->
  <!--  CREATOR LOGIC                                            -->
  <!-- ========================================================= -->
  <script>
    const nameInput = document.getElementById("tileName");
    const groupSelect = document.getElementById("tileGroup");
    const colorInput = document.getElementById("tileColor");
    const descInput = document.getElementById("tileDesc");

    const previewButton = document.getElementById("previewButton");
    const saveButton = document.getElementById("saveButton");

    const preview = document.getElementById("tilePreview");
    const previewName = document.getElementById("previewName");
    const previewGroup = document.getElementById("previewGroup");
    const previewDesc = document.getElementById("previewDesc");

    function groupLabel(g) {
      return {
        core: "Core State",
        intense: "Intense State",
        protective: "Protective State",
        growth: "Growth State"
      }[g] || "Emotion Group";
    }

    previewButton.addEventListener("click", () => {
      const name = nameInput.value.trim() || "Unnamed Emotion";
      const group = groupSelect.value;
      const color = colorInput.value || "#ffe9b3";
      const desc = descInput.value.trim() || "Describe this emotion to bring it to life.";

      preview.style.backgroundColor = color;
      previewName.textContent = name;
      previewGroup.textContent = groupLabel(group);
      previewDesc.textContent = desc;
    });

    saveButton.addEventListener("click", () => {
      const payload = {
        name: nameInput.value.trim(),
        group: groupSelect.value,
        color: colorInput.value,
        desc: descInput.value.trim(),
        createdAt: new Date().toISOString()
      };

      console.log("TILE SAVED (conceptual):", payload);
      alert("Tile created.\nFuture: send to gallery/e‑store for ecosystem voting.");
    });
  </script>

</body>
</html>
