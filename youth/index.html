<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUTH — WHOLEDONUTS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 40px;
            color: #000;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 200px);
            grid-gap: 30px;
        }

        .box {
            width: 200px;
            height: 200px;
            border: 3px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .box:hover {
            background: #000;
            color: #fff;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .back {
            margin-top: 40px;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            border: 2px solid #000;
            padding: 10px 20px;
            transition: 0.2s;
        }

        .back:hover {
            background: #000;
            color: #fff;
        }
    </style>
</head>

<body>

    <h1>YOUTH PATH</h1>

    <div class="grid">
        <a href="../table/"><div class="box">EMOTIONAL TABLE</div></a>
        <a href="../vault/"><div class="box">VAULT</div></a>
        <a href="../adult/"><div class="box">ADULT</div></a>
        <a href="../"><div class="box">HOME</div></a>
    </div>

    <a href="../"><div class="back">BACK TO CLOUD</div></a>

</body>
</html>
