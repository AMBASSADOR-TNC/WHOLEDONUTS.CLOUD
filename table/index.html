<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMOTIONAL PERIODIC TABLE — WHOLEDONUTS</title>
    <link rel="stylesheet" href="../identity.css">
    <script src="../identity-engine.js" defer></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        h1 {
            font-size: 32px;
            margin: 40px 0 20px 0;
            color: #000;
            letter-spacing: 2px;
            text-align: center;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 3px solid #000;
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 150px);
            grid-gap: 20px;
            margin-bottom: 40px;
        }

        .element {
            width: 150px;
            height: 150px;
            border: 3px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .element:hover {
            background: #000;
            color: #fff;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .back {
            margin-top: 20px;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            border: 2px solid #000;
            padding: 10px 20px;
            transition: 0.2s;
        }

        .back:hover {
            background: #000;
            color: #fff;
        }
    </style>
</head>

<body>

    <h1>THE TABLE</h1>

    <div class="section-title">YOUR EMOTIONAL PERIODIC TABLE</div>

    <div class="grid">
        <div class="element">JOY</div>
        <div class="element">ANGER</div>
        <div class="element">FEAR</div>
        <div class="element">LOVE</div>

        <div class="element">TRUST</div>
        <div class="element">SADNESS</div>
        <div class="element">HOPE</div>
        <div class="element">COURAGE</div>

        <div class="element">PEACE</div>
        <div class="element">SHAME</div>
        <div class="element">PRIDE</div>
        <div class="element">GRATITUDE</div>
    </div>

    <a href="../"><div class="back">BACK TO CLOUD</div></a>

</body>
</html>
